name: Narasi Hi-Res Android CI
on:
  push:
    branches:
      - feature/tes-rekaman-ai-offline
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35, NDK and CMake
        run: |
          SDK=/usr/local/lib/android/sdk
          TOOL=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$TOOL"
          yes | "$TOOL" --sdk_root="$SDK" --licenses > /dev/null || true
          "$TOOL" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile APK with bundled RNNoise engine
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: narasi-hires-debug
          path: app/build/outputs/apk/debug/app-debug.apk
